<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>时光之门</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="page-heading"><h1>时光之门</h1></header>
    <figure class="gate" aria-label="时光之门五屏预览">
      <div class="housing">
        <div class="vents" aria-hidden="true"></div>
        <div class="screens" aria-hidden="true">
          <div class="bezel"><div class="lcd lcd-1"></div></div>
          <div class="bezel"><div class="lcd lcd-2"></div></div>
          <div class="bezel"><div class="lcd lcd-3"></div></div>
          <div class="bezel"><div class="lcd lcd-4"></div></div>
          <div class="bezel"><div class="lcd lcd-5"><time id="sent-time" hidden></time></div></div>
        </div>
        <div class="base" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>
      <div class="foot" aria-hidden="true"></div>
    </figure>
    <form class="composer">
      <label for="message">显示文字</label>
      <div class="controls">
        <input id="message" type="text" placeholder="写点什么…" maxlength="48" autocomplete="off">
        <label class="paint" title="氛围灯颜色">
          <input id="color" type="color" value="#5ce7c5" aria-label="氛围灯颜色">
          <span aria-hidden="true">灯光</span>
        </label>
        <button type="submit" disabled>发送 <span class="send-arrow" aria-hidden="true"></span></button>
      </div>
      <div class="toolbar">
        <div class="attachments">
          <input id="sticker-file" type="file" accept="image/gif,image/png,image/jpeg,image/webp,.gif,.png,.jpg,.jpeg,.webp" hidden>
          <button type="button" id="choose-sticker"><span aria-hidden="true">+</span> 表情包</button>
          <span id="sticker-name"></span>
          <button type="button" id="remove-sticker" aria-label="移除表情包" title="移除表情包" hidden>×</button>
        </div>
        <div class="feedback">
          <p class="status" aria-live="polite"></p>
          <button type="button" id="mark-read" hidden>标为已读</button>
        </div>
      </div>
    </form>
  </main>
</body>
</html>
