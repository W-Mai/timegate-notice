<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="416" viewBox="0 0 1120 416" role="img" aria-labelledby="title description">
  <title id="title">TimeGate Notice architecture</title>
  <desc id="description">The browser and desktop automation call a Python HTTP service. Pillow renders five GIFs. The Divoom Times Gate II downloads the GIFs and receives playback and lighting commands. The service reads the current layout and uses a journal to restore it.</desc>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#1b2426"/>
      <stop offset="1" stop-color="#101516"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1.5 1.5 6.5 4.5 1.5 7.5" fill="none" stroke="#91d9c9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1118" height="414" rx="21" fill="url(#background)" stroke="#364143" stroke-width="2"/>
  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="40" y="51" fill="#eef5f3" font-size="24" font-weight="650">TimeGate Notice</text>
    <path d="M40 70h1040" stroke="#354143"/>

    <g fill="#20292b" stroke="#435153">
      <rect x="40" y="124" width="208" height="79" rx="11"/>
      <rect x="40" y="249" width="208" height="79" rx="11"/>
      <rect x="844" y="124" width="236" height="134" rx="13"/>
      <rect x="844" y="290" width="236" height="77" rx="11"/>
    </g>

    <rect x="359" y="96" width="372" height="271" rx="15" fill="#202c2e" stroke="#5e807a"/>
    <g fill="#161f21" stroke="#3c5152">
      <rect x="380" y="161" width="330" height="72" rx="9"/>
      <rect x="380" y="248" width="330" height="98" rx="9"/>
    </g>

    <g fill="none" stroke="#91d9c9" stroke-width="1.4" marker-end="url(#arrow)">
      <path d="M248 164h110"/>
      <path d="M248 289h110"/>
      <path d="M731 167h112"/>
      <path d="M844 224H732"/>
      <path d="M731 329h112"/>
    </g>

    <g font-size="14" fill="#add8d0" text-anchor="middle">
      <text x="303" y="151">HTTP</text>
      <text x="303" y="276">HTTP</text>
      <text x="787" y="154">Device API</text>
      <text x="787" y="211">GIF download</text>
      <text x="787" y="316">Read layout</text>
    </g>

    <g fill="#eff6f4" font-size="19" font-weight="600">
      <text x="55" y="155">Control page</text>
      <text x="55" y="280">Desktop automation</text>
      <text x="381" y="130">Python HTTP service</text>
      <text x="395" y="190">Render GIFs</text>
      <text x="395" y="279">Playback and restore</text>
      <text x="859" y="157">Divoom Times Gate II</text>
      <text x="859" y="321">Divoom channel service</text>
    </g>
    <g fill="#b3c1be" font-size="15">
      <text x="55" y="180">HTML · CSS · JavaScript</text>
      <text x="55" y="305">JSON over HTTP</text>
      <text x="395" y="214">Pillow · five 128 × 128 animations</text>
      <text x="395" y="305">30-minute timer · read action</text>
      <text x="395" y="327">Display layout and deadline journal</text>
      <text x="859" y="235">Five LCDs · RGB lighting</text>
      <text x="859" y="344">Current dial or screen group</text>
    </g>

    <g fill="#11181a" stroke="#435b5b">
      <rect x="861" y="177" width="32" height="32" rx="4"/>
      <rect x="899" y="177" width="32" height="32" rx="4"/>
      <rect x="937" y="177" width="32" height="32" rx="4"/>
      <rect x="975" y="177" width="32" height="32" rx="4"/>
      <rect x="1013" y="177" width="32" height="32" rx="4"/>
    </g>
    <path d="M856 182v22m194-22v22" stroke="#7de3ca" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
